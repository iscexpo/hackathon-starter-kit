<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A starter page for a hackathon web prototype.">
  <title>Hackathon Web Prototype</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <p class="eyebrow">Hackathon starter</p>
    <h1>Your project starts here</h1>
    <p>Replace this introduction with the problem your project helps solve.</p>
    <section aria-labelledby="demo-title">
      <h2 id="demo-title">Try a small interaction</h2>
      <label for="idea">What would you like to improve?</label>
      <input id="idea" name="idea" maxlength="160" placeholder="Describe an idea">
      <button id="show-idea" type="button">Show my idea</button>
      <p id="result" aria-live="polite"></p>
    </section>
    <footer><p>Document setup, limitations, data sources, and accessibility choices in your README.</p></footer>
  </main>
</body>
</html>
